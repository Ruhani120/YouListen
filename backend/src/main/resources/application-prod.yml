# Production profile (SPRING_PROFILES_ACTIVE=prod).
# No defaults on purpose: the app refuses to start if a secret is missing,
# instead of silently running with the dev values from application.yml.
server:
  shutdown: graceful
  forward-headers-strategy: framework   # we run behind Caddy (HTTPS)

spring:
  datasource:
    # sslmode=require: encrypted connection to RDS
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS}

logging:
  level:
    com.youlisten: INFO
    root: WARN
