spring:
  application:
    name: youlisten
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:harmonysync}
    username: ${DB_USERNAME:youlisten}
    password: ${DB_PASSWORD:youlisten_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:youlisten-super-secret-jwt-key-change-in-production-must-be-at-least-256-bits-long}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  spotify:
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    redirect-uri: ${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/spotify/callback}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    token-encryption-key: ${SPOTIFY_TOKEN_ENCRYPTION_KEY:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/google/callback}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    # Optional: lets song matching search YouTube without the user logging in with Google
    youtube-api-key: ${YOUTUBE_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
